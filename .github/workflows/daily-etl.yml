name: Günlük konser ETL

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 03:00 UTC = 06:00 İstanbul
  workflow_dispatch: {}    # Actions sekmesinden elle çalıştırma

concurrency:
  group: konser-etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python bağımlılıkları
        run: pip install --retries 5 --timeout 60 -r requirements.txt

      # Tarayıcı dosyaları her gün yeniden indirilmesin; anahtar Playwright sürümüne bağlı.
      - name: Playwright sürümü
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Ubuntu ayna sunucusu (azure.archive.ubuntu.com) zaman zaman DNS hatası veriyor.
      # apt'nin kendi tekrar denemesi açılıyor, her komut beklemeli olarak 5 kez deneniyor,
      # 3. denemeden sonra ana Ubuntu arşivine geçiliyor.
      - name: Sistem bağımlılıkları (tekrar denemeli)
        timeout-minutes: 20
        run: |
          set -u
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null

          use_main_mirror() {
            echo "::warning::Azure Ubuntu aynasına ulaşılamadı, archive.ubuntu.com kullanılıyor"
            # Ubuntu 24.04 runner'larında depo adresi ubuntu.sources içindeki
            # "mirror+file:/etc/apt/apt-mirrors.txt" listesinden okunuyor; üçü de güncelleniyor.
            sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
            sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
          }

          retry() {
            local n=1 max=5 delay=15
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::$n denemede başarısız: $*"
                return 1
              fi
              [ "$n" -eq 3 ] && use_main_mirror
              echo "::warning::Deneme $n başarısız, $((delay * n)) sn sonra tekrar: $*"
              sleep $((delay * n))
              n=$((n + 1))
            done
          }

          retry sudo apt-get update --error-on=any
          retry sudo -E env "PATH=$PATH" python -m playwright install-deps chromium
          retry python -m playwright install chromium

      - name: Testler
        run: pytest -q

      - name: ETL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipeline.py

      - name: Ham ve temiz CSV'leri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: konser-verisi-${{ github.run_id }}
          path: |
            data/*.csv
            data/debug/
          retention-days: 14
